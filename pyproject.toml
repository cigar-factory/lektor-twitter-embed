[project]
name = "lektor-twitter-embed"
version = "0.3.0"
description = "Lektor template filter to convert twitter links to embeds"
authors = [{name = "chris48s"}]
license = "MIT"
readme = "README.md"
keywords = ["Lektor plugin"]
requires-python = ">=3.11"
dependencies = [
    "requests==2.*",
    "lektor==3.*"
]
classifiers = [
    "Framework :: Lektor",
    "Environment :: Plugins",
]

[project.urls]
Source = "https://github.com/cigar-factory/lektor-twitter-embed"

[tool.poetry.group.dev.dependencies]
isort = "9.0.2"
flake8 = "7.4.1"
black = "26.10.1"
pytest = "9.1.1"
pytest-cov = "7.1.0"

[tool.poetry]
requires-poetry = ">=2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."lektor.plugins"]
twitter-embed = "lektor_twitter_embed:TwitterEmbedPlugin"
